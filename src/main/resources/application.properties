# Carga el archivo .env de la raiz del proyecto si existe (no se sube a Git). Las variables reales del sistema tienen prioridad.
spring.config.import=optional:file:.env[.properties]

# Configuracion comun para todos los perfiles
spring.application.name=bibliotecas-api
server.servlet.context-path=/bibliotecas

# Perfil activo por defecto (dev). Se puede sobreescribir con -Dspring.profiles.active=test|prod
spring.profiles.active=dev

# Configuracion basica de OpenAPI (comun a todos los entornos)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=false
springdoc.paths-to-match=/api/**

# Manejo de errores: no exponer stacktrace, si el mensaje generico
server.error.include-message=always
server.error.include-binding-errors=always

# --- Seguridad JWT ---
# Clave en Base64 de al menos 256 bits (32 bytes). La de abajo es SOLO para desarrollo: en produccion se define JWT_SECRET.
# Generar una propia: openssl rand -base64 32
jwt.secret=${JWT_SECRET:hB1zeCr/nKEUW74OuVrscZDamFC2olNgdrK8jWu+I/o=}
# Tiempo de vida del token en milisegundos (3600000 = 1 hora)
jwt.expiration=${JWT_EXPIRATION:3600000}

# --- CORS: origenes de los frontends permitidos, separados por coma (Angular 4200, Vite 5173, React 3000) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}

# --- Administrador general inicial (lo crea DataSeeder si no existe). Si la clave queda vacia no se crea ---
app.admin.email=${ADMIN_EMAIL:admin@biblioteca.com}
app.admin.password=${ADMIN_PASSWORD:Admin12345}

# Perfil TEST: base de datos en memoria H2 (no requiere instalar nada, ideal para pruebas con Postman)
server.port=8090

spring.datasource.url=jdbc:h2:mem:bibliotecas_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola web de H2 disponible en /bibliotecas/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

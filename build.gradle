plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id "io.qameta.allure" version "2.11.2"
}

group = 'com.taller'
version = '1.0.0'
description = 'Sistema de Gestion de Multiples Bibliotecas - Taller Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation("org.mockito:mockito-core:5.24.0")
	testImplementation("org.mockito:mockito-junit-jupiter:5.24.0")

	// Base de datos en memoria para pruebas (perfil "test")
	testRuntimeOnly 'com.h2database:h2'
	runtimeOnly 'com.h2database:h2'

	// Conector MySQL para los perfiles dev/prod
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Documentacion OpenAPI / Swagger UI
	implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.12")

	// MapStruct para mapeo Entity <-> DTO
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacoco{
	toolVersion '0.8.14'
}

jacocoTestReport{
	dependsOn test
	reports{
		xml.required = true
		html.required = true
	}
	finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification{
	violationRules {
		// Regla general del proyecto (igual a la del taller original)
		rule{
			limit{
				minimum = 0.02
			}
		}

		// Regla para la capa de negocio: cada servicio debe tener al menos 85% de lineas cubiertas
		// por sus pruebas unitarias (src/test/java/.../businessLayer)
		rule{
			element = 'CLASS'
			includes = ['com.taller.bibliotecas.businessLayer.service.impl.*']
			limit{
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.85
			}
		}
	}

}

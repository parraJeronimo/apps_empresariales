# Perfil DEV: MySQL local, el esquema se ajusta en cada arranque (comodo mientras se desarrolla)
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bibliotecas_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

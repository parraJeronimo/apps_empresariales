# Perfil PROD: MySQL, nunca se borra ni se recrea el esquema automaticamente
server.port=8099

spring.datasource.url=jdbc:mysql://localhost:3306/bibliotecas_db?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Seguridad (PROD): sin valores por defecto. Si falta JWT_SECRET la aplicacion no arranca (es lo deseado) ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# Si ADMIN_PASSWORD no se define no se crea ningun administrador inicial
app.admin.password=${ADMIN_PASSWORD:}

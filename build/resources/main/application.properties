# Configuracion comun para todos los perfiles
spring.application.name=bibliotecas-api
server.servlet.context-path=/bibliotecas

# Perfil activo por defecto (dev). Se puede sobreescribir con -Dspring.profiles.active=test|prod
spring.profiles.active=dev

# Configuracion basica de OpenAPI (comun a todos los entornos)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=false
springdoc.paths-to-match=/api/**

# Manejo de errores: no exponer stacktrace, si el mensaje generico
server.error.include-message=always
server.error.include-binding-errors=always
